packages:
  - "."
  - "viewer"

allowBuilds:
  '@swc/core': false
  unrs-resolver: false

# See: https://pnpm.io/supply-chain-security
blockExoticSubdeps: true
minimumReleaseAge: 20160 # 14 days

minimumReleaseAgeExclude:
  - '@api3/*'
  # Renovate security update: svgo@4.0.2 || 4.1.0
  - svgo@4.0.2 || 4.1.0
  # Renovate security update: vite@8.3.3
  - vite@8.3.3

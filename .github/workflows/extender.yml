name: Extend supported logos

on:
  workflow_dispatch:
    inputs:
      type:
        description: "chains | symbols | api-providers | auto-clear"
        required: true
        type: choice
        options:
          - auto-clear
          - chains
          - symbols
          - api-providers
      value:
        description: "Comma separated values OR --clear (ignored when type=auto-clear)"
        required: false
        default: ""


permissions:
  contents: write
  pull-requests: write

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Git user
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: 'pnpm'

      - name: Install Packages  
        run: pnpm install

      - name: Extend extension.json
        env:
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_VALUE: ${{ inputs.value }}
        run: |
          if [ "$INPUT_TYPE" = "auto-clear" ]; then
            node scripts/extend-json.js auto-clear
          else
            node scripts/extend-json.js "$INPUT_TYPE" "$INPUT_VALUE"
          fi

      - name: Commit changes and open PR (if any)
        env:
          INPUT_TYPE: ${{ inputs.type }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add extension.json
            git commit -m "chore: extend $INPUT_TYPE" --no-verify --signoff
            branch="bot/extender-${{ github.run_id }}-${{ github.run_attempt }}"
            git push origin "HEAD:refs/heads/$branch"
            pr_url=$(gh pr create -B "$BASE" -H "$branch" \
              --title "chore: extend $INPUT_TYPE" \
              --body "Opened by [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).")
            gh pr merge "$pr_url" --merge --delete-branch
          else
            echo "No changes to commit"
          fi

